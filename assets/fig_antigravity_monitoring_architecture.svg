<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Inter, sans-serif">
  <rect width="980" height="420" fill="#0B0F19"/>
  <text x="490" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Google Antigravity AI: 4 Ustunli Kod Nazorati va Self-Healing Sikli</text>

  <!-- 4 pillar boxes -->
  <g font-size="13" font-weight="700">
    <rect x="40" y="70" width="200" height="120" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="140" y="100" text-anchor="middle" fill="#38BDF8">1. AST Linter</text>
    <text x="140" y="125" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">while(true), eval(),</text>
    <text x="140" y="142" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">xavfli DOM murojaati</text>

    <rect x="270" y="70" width="200" height="120" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <text x="370" y="100" text-anchor="middle" fill="#34D399">2. Fizik Invariantlar</text>
    <text x="370" y="125" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">dE/E0 &lt; 1e-3,</text>
    <text x="370" y="142" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">impuls saqlanishi</text>

    <rect x="500" y="70" width="200" height="120" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
    <text x="600" y="100" text-anchor="middle" fill="#FBBF24">3. Kadr Profayli</text>
    <text x="600" y="125" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">Δt ≤ 16.6ms,</text>
    <text x="600" y="142" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">Object Pool nazorati</text>

    <rect x="730" y="70" width="200" height="120" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <text x="830" y="100" text-anchor="middle" fill="#C084FC">4. Self-Refine Loop</text>
    <text x="830" y="125" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">Xatoni LLM'ga</text>
    <text x="830" y="142" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">qayta yuborish</text>
  </g>

  <!-- flow arrows -->
  <line x1="240" y1="130" x2="270" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="470" y1="130" x2="500" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="700" y1="130" x2="730" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- loop back -->
  <path d="M 830 190 L 830 260 L 140 260 L 140 190" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar2)"/>
  <text x="490" y="280" text-anchor="middle" fill="#F43F5E" font-size="12">Xato aniqlansa: avtomatik qayta generatsiya (Reflexion, Shinn et al. 2023)</text>

  <rect x="290" y="330" width="400" height="60" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="490" y="365" text-anchor="middle" fill="#CBD5E1" font-size="13">Natija: Barqaror, energiya saqlovchi, xavfsiz simulyatsiya kodi</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F43F5E"/></marker>
  </defs>
</svg>
