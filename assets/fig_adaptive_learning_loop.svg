<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="Inter, sans-serif">
  <rect width="980" height="440" fill="#0B0F19"/>
  <text x="490" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">MagicSchool AI: Adaptiv O'quv Trayektoriyasi (Zimmerman SRL Sikli)</text>

  <!-- 3 phase cycle -->
  <g font-size="13" font-weight="700">
    <circle cx="200" cy="130" r="70" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="200" y="118" text-anchor="middle" fill="#38BDF8">1. Oldindan</text>
    <text x="200" y="136" text-anchor="middle" fill="#38BDF8">O'ylash</text>
    <text x="200" y="154" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">Maqsad qo'yish</text>

    <circle cx="490" cy="130" r="70" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
    <text x="490" y="118" text-anchor="middle" fill="#FBBF24">2. Bajarish &amp;</text>
    <text x="490" y="136" text-anchor="middle" fill="#FBBF24">Monitoring</text>
    <text x="490" y="154" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">Otter.ai diqqat nazorati</text>

    <circle cx="780" cy="130" r="70" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <text x="780" y="118" text-anchor="middle" fill="#34D399">3. O'z-o'zini</text>
    <text x="780" y="136" text-anchor="middle" fill="#34D399">Baholash</text>
    <text x="780" y="154" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">Kognitiv Radar tahlili</text>
  </g>

  <path d="M 270 130 L 420 130" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 560 130 L 710 130" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 780 200 C 780 250, 200 250, 200 200" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar2)"/>
  <text x="490" y="252" text-anchor="middle" fill="#F43F5E" font-size="11">MagicSchool AI: ZPD asosida scaffolding mikromodul</text>

  <!-- 3 cluster growth bars -->
  <text x="490" y="300" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="700">Kognitiv Klaster Bo'yicha O'sish Dinamikasi (1—11 Modul)</text>

  <g>
    <text x="120" y="330" fill="#F43F5E" font-size="12" font-weight="700">Klaster A</text>
    <rect x="200" y="317" width="80" height="16" rx="3" fill="rgba(244,63,94,0.15)" stroke="#F43F5E"/>
    <rect x="200" y="317" width="230" height="16" rx="3" fill="none" stroke="#334155" stroke-dasharray="2,3"/>
    <text x="440" y="330" fill="#94A3B8" font-size="11">35% → 58%</text>

    <text x="120" y="365" fill="#FBBF24" font-size="12" font-weight="700">Klaster B</text>
    <rect x="200" y="352" width="160" height="16" rx="3" fill="rgba(251,191,36,0.15)" stroke="#FBBF24"/>
    <rect x="200" y="352" width="230" height="16" rx="3" fill="none" stroke="#334155" stroke-dasharray="2,3"/>
    <text x="440" y="365" fill="#94A3B8" font-size="11">52% → 76%</text>

    <text x="120" y="400" fill="#34D399" font-size="12" font-weight="700">Klaster C</text>
    <rect x="200" y="387" width="215" height="16" rx="3" fill="rgba(52,211,153,0.15)" stroke="#34D399"/>
    <rect x="200" y="387" width="230" height="16" rx="3" fill="none" stroke="#334155" stroke-dasharray="2,3"/>
    <text x="440" y="400" fill="#94A3B8" font-size="11">68% → 91%</text>
  </g>

  <rect x="600" y="300" width="330" height="110" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="765" y="325" text-anchor="middle" fill="#CBD5E1" font-size="12" font-weight="700">Zimmerman (2002) SRL Modeli</text>
  <text x="765" y="348" text-anchor="middle" fill="#94A3B8" font-size="11">AI-shaxsiylashtirilgan trayektoriya</text>
  <text x="765" y="366" text-anchor="middle" fill="#94A3B8" font-size="11">o'zlashtirish samaradorligini</text>
  <text x="765" y="384" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700">38% ga oshiradi</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F43F5E"/></marker>
  </defs>
</svg>
