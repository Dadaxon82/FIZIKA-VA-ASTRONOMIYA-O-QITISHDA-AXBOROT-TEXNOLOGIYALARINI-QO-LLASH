  </g>
  <line x1="600" y1="120" x2="640" y2="120" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- MagicSchool AI feedback loop -->
  <g>
    <rect x="330" y="250" width="320" height="90" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="490" y="280" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="700">MagicSchool AI</text>
    <text x="490" y="300" text-anchor="middle" fill="#94A3B8" font-size="11">Kognitiv Radar • ZPD Scaffolding</text>
    <text x="490" y="318" text-anchor="middle" fill="#94A3B8" font-size="11">Individual O'quv Trayektoriyasi</text>
  </g>

  <path d="M 780 170 L 780 295 L 650 295" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar2)"/>
  <path d="M 330 295 L 90 295 L 90 154" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar2)"/>
  <text x="490" y="230" text-anchor="middle" fill="#F43F5E" font-size="12">Telemetriya asosida adaptiv qayta aloqa sikli (har hafta yangilanadi)</text>

