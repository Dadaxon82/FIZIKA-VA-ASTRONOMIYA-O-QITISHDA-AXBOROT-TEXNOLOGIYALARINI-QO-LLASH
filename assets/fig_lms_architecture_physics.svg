  <g>
    <rect x="640" y="70" width="280" height="100" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
    <text x="780" y="100" text-anchor="middle" fill="#FBBF24" font-size="14" font-weight="700">LMS Yadrosi</text>
    <text x="780" y="120" text-anchor="middle" fill="#94A3B8" font-size="11">Moodle / Canvas / Open edX</text>
    <text x="780" y="138" text-anchor="middle" fill="#94A3B8" font-size="11">LTI 1.3 • xAPI • Baholar Jurnali</text>
