<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F43F5E"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#38BDF8"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C084FC"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FBBF24"/></marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
  </defs>

  <rect width="900" height="520" fill="#0B0F19"/>

  <!-- Ground -->
  <line x1="40" y1="460" x2="860" y2="460" stroke="#334155" stroke-width="3"/>
  <g stroke="#334155" stroke-width="2">
    <line x1="40" y1="460" x2="20" y2="480"/>
    <line x1="90" y1="460" x2="70" y2="480"/>
    <line x1="140" y1="460" x2="120" y2="480"/>
  </g>

  <!-- Incline triangle: base at (120,460), apex at (700,140) -->
  <polygon points="120,460 700,140 700,460" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-width="3"/>

  <!-- Angle arc + label -->
  <path d="M 200 460 A 80 80 0 0 0 165 393" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="215" y="435" fill="#CBD5E1" font-size="24">α</text>

  <!-- Block on incline, centered around a point along the incline -->
  <g transform="translate(430,296) rotate(-29)">
    <rect x="-42" y="-70" width="84" height="56" rx="8" fill="#0EA5E9" stroke="#0369A1" stroke-width="3"/>
    <text x="0" y="-38" text-anchor="middle" fill="#0C4A6E" font-weight="700" font-size="22">m</text>
  </g>

  <!-- Force vectors from block center (approx world coords of block's outward face center) -->
  <!-- mg: straight down -->
  <line x1="430" y1="296" x2="430" y2="430" stroke="#F43F5E" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="440" y="420" fill="#F43F5E" font-weight="700" font-size="20">mg</text>

  <!-- N: perpendicular to incline surface (outward normal) -->
  <line x1="430" y1="296" x2="304" y2="220" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <text x="285" y="205" fill="#38BDF8" font-weight="700" font-size="20">N</text>

  <!-- F: applied, up the incline -->
  <line x1="430" y1="296" x2="560" y2="221" stroke="#C084FC" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="570" y="210" fill="#C084FC" font-weight="700" font-size="20">F</text>

  <!-- friction: along incline, opposing motion (down-slope shown) -->
  <line x1="430" y1="296" x2="356" y2="335" stroke="#FBBF24" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <text x="300" y="352" fill="#FBBF24" font-weight="700" font-size="20">f</text>

  <!-- Dashed weight components -->
  <line x1="430" y1="430" x2="356" y2="335" stroke="#FCA5A5" stroke-width="2.5" stroke-dasharray="6,5"/>
  <text x="352" y="378" fill="#FCA5A5" font-size="16">mg∥</text>
  <line x1="430" y1="430" x2="304" y2="220" stroke="#FCA5A5" stroke-width="0" />
  <line x1="356" y1="335" x2="430" y2="430" stroke="#FCA5A5" stroke-width="0"/>

  <!-- Legend -->
  <g font-size="17" fill="#CBD5E1">
    <rect x="700" y="330" width="170" height="150" rx="10" fill="#0F172A" stroke="#1E293B"/>
    <line x1="716" y1="352" x2="740" y2="352" stroke="#F43F5E" stroke-width="4" marker-end="url(#arrowRed)"/>
    <text x="748" y="358">Og'irlik (mg)</text>
    <line x1="716" y1="380" x2="740" y2="380" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <text x="748" y="386">Normal (N)</text>
    <line x1="716" y1="408" x2="740" y2="408" stroke="#C084FC" stroke-width="4" marker-end="url(#arrowPurple)"/>
    <text x="748" y="414">Tashqi kuch (F)</text>
    <line x1="716" y1="436" x2="740" y2="436" stroke="#FBBF24" stroke-width="4" marker-end="url(#arrowAmber)"/>
    <text x="748" y="442">Ishqalanish (f)</text>
    <line x1="716" y1="464" x2="740" y2="464" stroke="#FCA5A5" stroke-width="2.5" stroke-dasharray="5,4"/>
    <text x="748" y="470">mg tarkiblari</text>
  </g>

  <text x="450" y="40" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="700">Qiyalikdagi Jismning Erkin Jism Diagrammasi (FBD)</text>
</svg>
