<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" font-family="Inter, sans-serif">
  <rect width="980" height="380" fill="#0B0F19"/>
  <text x="490" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Klassik Mexanika: 4 Bosqichli To'liq AI-Pipeline Konveyeri</text>

  <g font-size="13" font-weight="700">
    <rect x="30" y="80" width="205" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="132" y="112" text-anchor="middle" fill="#38BDF8">1. PhET / Vascak.cz</text>
    <text x="132" y="132" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">Teskari muhandislik:</text>
    <text x="132" y="150" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">FBD, tenglamalar,</text>
    <text x="132" y="168" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">parametrlar ajratish</text>

    <rect x="265" y="80" width="205" height="110" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <text x="367" y="112" text-anchor="middle" fill="#C084FC">2. Claude 3.5 Sonnet</text>
    <text x="367" y="132" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">Vector2D, Simplektik</text>
    <text x="367" y="150" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">Eyler-Kromer, MTV</text>
    <text x="367" y="168" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">to'qnashuv dvigateli</text>

    <rect x="500" y="80" width="205" height="110" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
    <text x="602" y="112" text-anchor="middle" fill="#FBBF24">3. Google Antigravity</text>
    <text x="602" y="132" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">60 FPS Delta-Time,</text>
    <text x="602" y="150" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">ΔE/E₀ &lt; 10⁻³ auditi,</text>
    <text x="602" y="168" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">AST xavfsizlik tahlili</text>

    <rect x="735" y="80" width="215" height="110" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="2"/>
    <text x="842" y="112" text-anchor="middle" fill="#F43F5E">4. Runway Gen-2</text>
    <text x="842" y="132" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">Neyron video sintezi,</text>
    <text x="842" y="150" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">slow-motion kinematik</text>
    <text x="842" y="168" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="400">illyustratsiya</text>
  </g>

  <line x1="235" y1="135" x2="265" y2="135" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="470" y1="135" x2="500" y2="135" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="705" y1="135" x2="735" y2="135" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="240" y="250" width="500" height="90" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="490" y="280" text-anchor="middle" fill="#34D399" font-size="14" font-weight="700">Natija: Fizik jihatdan barqaror, energiya saqlovchi</text>
  <text x="490" y="302" text-anchor="middle" fill="#34D399" font-size="14" font-weight="700">mexanika simulyatsiyasi + kinematik video</text>
  <text x="490" y="322" text-anchor="middle" fill="#94A3B8" font-size="11">(Capstone raqamli portfolioga tayyor)</text>
  <line x1="842" y1="190" x2="842" y2="295" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="842" y1="295" x2="740" y2="295" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
