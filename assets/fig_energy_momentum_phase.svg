<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Inter, sans-serif">
  <rect width="980" height="420" fill="#0B0F19"/>
  <text x="490" y="32" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Fazaviy Portret va Energiya Saqlanishi: Simplektik vs Oddiy Eyler</text>

  <!-- Left: phase portrait -->
  <g>
    <text x="230" y="65" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="700">Fazaviy Portret (x, v)</text>
    <line x1="60" y1="230" x2="420" y2="230" stroke="#334155" stroke-width="1"/>
    <line x1="240" y1="90" x2="240" y2="370" stroke="#334155" stroke-width="1"/>
    <text x="410" y="245" fill="#94A3B8" font-size="11">x</text>
    <text x="248" y="100" fill="#94A3B8" font-size="11">v</text>

    <!-- Symplectic: closed stable ellipse -->
    <ellipse cx="240" cy="230" rx="120" ry="80" fill="none" stroke="#34D399" stroke-width="2.5"/>
    <!-- Naive Euler: outward spiral -->
    <path d="M 240 230 Q 280 200 300 230 Q 330 270 280 300 Q 210 340 160 280 Q 120 220 180 170 Q 260 110 340 170 Q 400 220 350 290"
          fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="5,3"/>
  </g>
  <g font-size="12">
    <rect x="60" y="385" width="14" height="14" fill="#34D399"/>
    <text x="80" y="397" fill="#CBD5E1">Simplektik Eyler-Kromer — yopiq, barqaror orbita</text>
  </g>

  <!-- Right: energy vs time -->
  <g>
    <text x="740" y="65" text-anchor="middle" fill="#C084FC" font-size="13" font-weight="700">Energiya E(t) Grafigi</text>
    <line x1="580" y1="330" x2="920" y2="330" stroke="#334155" stroke-width="1"/>
    <line x1="580" y1="330" x2="580" y2="100" stroke="#334155" stroke-width="1"/>
    <text x="910" y="345" fill="#94A3B8" font-size="11">t</text>
    <text x="588" y="95" fill="#94A3B8" font-size="11">E</text>

    <!-- Symplectic: flat bounded line -->
    <polyline points="580,260 620,258 660,262 700,259 740,261 780,258 820,262 860,259 900,260"
              fill="none" stroke="#34D399" stroke-width="2.5"/>
    <!-- Naive Euler: exponential blow-up -->
    <polyline points="580,260 620,250 660,235 700,210 740,175 780,130 820,108"
              fill="none" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="600" y="245" fill="#34D399" font-size="10">chegaralangan (&lt;10⁻³)</text>
    <text x="760" y="140" fill="#F43F5E" font-size="10">eksponentsial portlash</text>
  </g>

  <g font-size="12">
    <rect x="580" y="385" width="14" height="14" fill="#F43F5E"/>
    <text x="600" y="397" fill="#CBD5E1">Oddiy Eyler — sun'iy energiya o'sishi (dreyf)</text>
  </g>
</svg>
