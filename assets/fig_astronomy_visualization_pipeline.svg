<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" font-family="Inter, sans-serif">
  <rect width="980" height="320" fill="#0B0F19"/>
  <text x="490" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Astronomik Ma'lumotlarni Vizuallashtirish Konveyeri</text>

  <g font-size="12" font-weight="700">
    <rect x="30" y="90" width="170" height="100" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="115" y="125" text-anchor="middle" fill="#38BDF8">1. Ma'lumot</text>
    <text x="115" y="145" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">Kepler parametrlari</text>
    <text x="115" y="160" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">(a, e, M, G)</text>

    <rect x="230" y="90" width="170" height="100" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <text x="315" y="125" text-anchor="middle" fill="#34D399">2. Masshtablash</text>
    <text x="315" y="145" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">AU → normallashtirilgan</text>
    <text x="315" y="160" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">birliklar</text>

    <rect x="430" y="90" width="170" height="100" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
    <text x="515" y="125" text-anchor="middle" fill="#FBBF24">3. World-to-Screen</text>
    <text x="515" y="145" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">Affin transformatsiya</text>
    <text x="515" y="160" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">(Canvas koordinatasi)</text>

    <rect x="630" y="90" width="170" height="100" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <text x="715" y="125" text-anchor="middle" fill="#C084FC">4. Render</text>
    <text x="715" y="145" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">HTML5 Canvas 2D,</text>
    <text x="715" y="160" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">HUD telemetriya</text>

    <rect x="830" y="90" width="120" height="100" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="2"/>
    <text x="890" y="125" text-anchor="middle" fill="#F43F5E">5. Audio-Sinxron</text>
    <text x="890" y="145" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">TTS bayon,</text>
    <text x="890" y="160" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">SSML vaqt kodlari</text>
  </g>

  <line x1="200" y1="140" x2="230" y2="140" stroke="#94A3B8" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="400" y1="140" x2="430" y2="140" stroke="#94A3B8" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="600" y1="140" x2="630" y2="140" stroke="#94A3B8" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="800" y1="140" x2="830" y2="140" stroke="#94A3B8" stroke-width="2" marker-end="url(#pa)"/>

  <text x="490" y="250" text-anchor="middle" fill="#94A3B8" font-size="13">Kepler yopiq yechimi → integratsion xatosiz, energiya va impuls momenti aniq saqlanadi</text>

  <defs>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
