<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter, sans-serif">
  <rect width="900" height="340" fill="#0B0F19"/>
  <text x="450" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Penetratsiyani Bartaraf Etish: Minimum Translation Vector (MTV)</text>

  <!-- Before: overlapping -->
  <text x="230" y="70" text-anchor="middle" fill="#F43F5E" font-size="15" font-weight="700">❌ Oldin: Jismlar Bir-biriga Kirib Ketgan</text>
  <rect x="60" y="90" width="340" height="160" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="2"/>
  <circle cx="200" cy="170" r="45" fill="#38BDF8" opacity="0.75"/>
  <circle cx="260" cy="170" r="35" fill="#FBBF24" opacity="0.75"/>
  <line x1="155" y1="230" x2="305" y2="230" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="230" y="245" text-anchor="middle" fill="#F43F5E" font-size="11">penetration = (r1+r2) - dist &gt; 0</text>

  <!-- After: separated -->
  <text x="670" y="70" text-anchor="middle" fill="#34D399" font-size="15" font-weight="700">✅ Keyin: MTV Bo'yicha Ajratilgan</text>
  <rect x="500" y="90" width="340" height="160" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <circle cx="610" cy="170" r="45" fill="#38BDF8" opacity="0.9"/>
  <circle cx="710" cy="170" r="35" fill="#FBBF24" opacity="0.9"/>
  <line x1="610" y1="170" x2="580" y2="170" stroke="#34D399" stroke-width="2.5" marker-end="url(#m1)"/>
  <line x1="710" y1="170" x2="740" y2="170" stroke="#34D399" stroke-width="2.5" marker-end="url(#m2)"/>
  <text x="660" y="245" text-anchor="middle" fill="#34D399" font-size="11">har biri penetration/2 masofaga suriladi</text>

  <!-- Formula box -->
  <rect x="150" y="275" width="600" height="50" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="450" y="305" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="monospace">correction = penetration × (invM / totalInvM) × n̂</text>

  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#34D399"/></marker>
    <marker id="m2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#34D399"/></marker>
  </defs>
</svg>
