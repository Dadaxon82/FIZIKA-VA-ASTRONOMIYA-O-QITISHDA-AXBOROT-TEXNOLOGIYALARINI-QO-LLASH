<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, sans-serif">
  <rect width="900" height="380" fill="#0B0F19"/>
  <text x="450" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Vektor Arifmetikasi: Qo'shish, Skalyar Ko'paytma va Normalizatsiya</text>

  <!-- Vector addition panel -->
  <g>
    <rect x="40" y="70" width="260" height="260" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="170" y="96" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="700">1. Vektorlar Qo'shilishi</text>
    <line x1="80" y1="280" x2="80" y2="120" stroke="#334155" stroke-width="1"/>
    <line x1="80" y1="280" x2="260" y2="280" stroke="#334155" stroke-width="1"/>
    <line x1="80" y1="280" x2="180" y2="200" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#a1)"/>
    <line x1="180" y1="200" x2="240" y2="140" stroke="#34D399" stroke-width="2.5" marker-end="url(#a2)"/>
    <line x1="80" y1="280" x2="240" y2="140" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#a3)"/>
    <text x="130" y="255" fill="#38BDF8" font-size="12">v1</text>
    <text x="215" y="165" fill="#34D399" font-size="12">v2</text>
    <text x="150" y="195" fill="#FBBF24" font-size="12">v1+v2</text>
  </g>

  <!-- Dot product panel -->
  <g>
    <rect x="320" y="70" width="260" height="260" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
    <text x="450" y="96" text-anchor="middle" fill="#FBBF24" font-size="14" font-weight="700">2. Skalyar Ko'paytma (dot)</text>
    <line x1="360" y1="280" x2="360" y2="120" stroke="#334155" stroke-width="1"/>
    <line x1="360" y1="280" x2="540" y2="280" stroke="#334155" stroke-width="1"/>
    <line x1="360" y1="280" x2="520" y2="280" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#a1)"/>
    <line x1="360" y1="280" x2="470" y2="180" stroke="#34D399" stroke-width="2.5" marker-end="url(#a2)"/>
    <line x1="470" y1="180" x2="520" y2="280" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="500" y="270" fill="#38BDF8" font-size="12">n̂</text>
    <text x="480" y="170" fill="#34D399" font-size="12">v</text>
    <text x="360" y="330" text-anchor="middle" fill="#CBD5E1" font-size="11">v·n̂ = |v||n̂|cos(θ) — normal proyeksiya</text>
    <text x="450" y="350" text-anchor="middle" fill="#94A3B8" font-size="10">v·n̂ &lt; 0 → yaqinlashish; v·n̂ ≥ 0 → uzoqlashish</text>
  </g>

  <!-- Normalization panel -->
  <g>
    <rect x="600" y="70" width="260" height="260" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <text x="730" y="96" text-anchor="middle" fill="#C084FC" font-size="14" font-weight="700">3. Normalizatsiya</text>
    <line x1="640" y1="280" x2="640" y2="120" stroke="#334155" stroke-width="1"/>
    <line x1="640" y1="280" x2="820" y2="280" stroke="#334155" stroke-width="1"/>
    <line x1="640" y1="280" x2="800" y2="150" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#a4)"/>
    <text x="770" y="150" fill="#F43F5E" font-size="12">v (uzun)</text>
    <circle cx="640" cy="280" r="60" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="640" y1="280" x2="682" y2="234" stroke="#C084FC" stroke-width="2.5" marker-end="url(#a5)"/>
    <text x="690" y="230" fill="#C084FC" font-size="12">n̂ = v/|v|</text>
    <text x="730" y="330" text-anchor="middle" fill="#94A3B8" font-size="10">Uzunlik = 1 birlik vektor (yo'nalish saqlanadi)</text>
  </g>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38BDF8"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#34D399"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#FBBF24"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F43F5E"/></marker>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C084FC"/></marker>
  </defs>
</svg>
