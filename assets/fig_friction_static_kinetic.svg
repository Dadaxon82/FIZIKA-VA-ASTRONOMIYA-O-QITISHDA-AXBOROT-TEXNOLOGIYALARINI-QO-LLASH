<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, sans-serif">
  <defs>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/></marker>
  </defs>

  <rect width="900" height="480" fill="#0B0F19"/>
  <text x="450" y="40" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="700">Statik va Kinetik Ishqalanish Kuchi Grafigi</text>

  <!-- Axes -->
  <line x1="100" y1="410" x2="820" y2="410" stroke="#94A3B8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="100" y1="410" x2="100" y2="70" stroke="#94A3B8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="800" y="400" fill="#CBD5E1" font-size="18">Qo'llangan kuch, F</text>
  <text x="60" y="80" fill="#CBD5E1" font-size="18">f</text>

  <!-- Static region: line rising f = F, from origin to peak -->
  <line x1="100" y1="410" x2="330" y2="180" stroke="#38BDF8" stroke-width="4"/>
  <!-- Peak marker -->
  <circle cx="330" cy="180" r="6" fill="#38BDF8"/>
  <line x1="330" y1="180" x2="330" y2="410" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="180" x2="330" y2="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="60" y="185" fill="#38BDF8" font-size="16" font-weight="700">f_s,max</text>
  <text x="310" y="435" fill="#38BDF8" font-size="15">F = f_s,max</text>

  <!-- Drop to kinetic level -->
  <line x1="330" y1="180" x2="330" y2="255" stroke="#F43F5E" stroke-width="3" stroke-dasharray="3,4"/>

  <!-- Kinetic region: constant lower level -->
  <line x1="330" y1="255" x2="800" y2="255" stroke="#FBBF24" stroke-width="4"/>
  <line x1="100" y1="255" x2="330" y2="255" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="60" y="260" fill="#FBBF24" font-size="16" font-weight="700">f_k</text>

  <!-- Region labels -->
  <text x="180" y="330" fill="#94A3B8" font-size="16">Statik zona</text>
  <text x="185" y="352" fill="#94A3B8" font-size="13">(jism qo'zg'almaydi, f = F)</text>
  <text x="550" y="230" fill="#94A3B8" font-size="16">Kinetik zona</text>
  <text x="545" y="205" fill="#94A3B8" font-size="13">(jism sirpanmoqda, f = μ_k N doimiy)</text>

  <!-- Legend box -->
  <g font-size="15" fill="#CBD5E1">
    <rect x="640" y="330" width="220" height="110" rx="10" fill="#0F172A" stroke="#1E293B"/>
    <line x1="656" y1="352" x2="686" y2="352" stroke="#38BDF8" stroke-width="4"/>
    <text x="694" y="357">Statik ishqalanish (f_s)</text>
    <line x1="656" y1="380" x2="686" y2="380" stroke="#FBBF24" stroke-width="4"/>
    <text x="694" y="385">Kinetik ishqalanish (f_k)</text>
    <line x1="656" y1="408" x2="686" y2="408" stroke="#F43F5E" stroke-width="3" stroke-dasharray="3,4"/>
    <text x="694" y="413">Sirpanish boshlanishi</text>
  </g>
</svg>
