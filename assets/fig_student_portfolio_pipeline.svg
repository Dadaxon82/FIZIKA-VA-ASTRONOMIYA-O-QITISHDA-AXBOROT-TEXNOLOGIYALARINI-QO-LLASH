<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Inter, sans-serif">
  <rect width="980" height="420" fill="#0B0F19"/>
  <text x="490" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Google Antigravity AI: Raqamli Fizika Portfoliosi Konveyeri</text>

  <!-- Pipeline stages -->
  <g font-size="13" font-weight="700">
    <rect x="30" y="80" width="190" height="100" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="125" y="110" text-anchor="middle" fill="#38BDF8">1. Jarayonli</text>
    <text x="125" y="128" text-anchor="middle" fill="#38BDF8">Portfolio</text>
    <text x="125" y="150" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">Laboratoriya jurnali,</text>
    <text x="125" y="165" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">MagicSchool loglari</text>

    <rect x="255" y="80" width="190" height="100" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <text x="350" y="110" text-anchor="middle" fill="#C084FC">2. AST Statik</text>
    <text x="350" y="128" text-anchor="middle" fill="#C084FC">Tahlil</text>
    <text x="350" y="150" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">Kod sifati, xavfsizlik,</text>
    <text x="350" y="165" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">arxitektura mosligi</text>

    <rect x="480" y="80" width="190" height="100" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
    <text x="575" y="110" text-anchor="middle" fill="#FBBF24">3. Fizik</text>
    <text x="575" y="128" text-anchor="middle" fill="#FBBF24">Invariantlar Auditi</text>
    <text x="575" y="150" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">ΔE/E₀ &lt; 10⁻³,</text>
    <text x="575" y="165" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">impuls saqlanishi</text>

    <rect x="705" y="80" width="220" height="100" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <text x="815" y="110" text-anchor="middle" fill="#34D399">4. Showcase</text>
    <text x="815" y="128" text-anchor="middle" fill="#34D399">Portfolio</text>
    <text x="815" y="150" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">GitHub Pages raqamli</text>
    <text x="815" y="165" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="400">pasport + Badge</text>
  </g>

  <line x1="220" y1="130" x2="255" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="445" y1="130" x2="480" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="670" y1="130" x2="705" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Fail loop -->
  <path d="M 575 180 L 575 240 L 350 240 L 350 180" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar2)"/>
  <text x="490" y="260" text-anchor="middle" fill="#F43F5E" font-size="11">Audit muvaffaqiyatsiz: talabaga tuzatish tavsiyalari qaytariladi</text>

  <!-- Certificate output -->
  <rect x="330" y="300" width="320" height="80" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="490" y="330" text-anchor="middle" fill="#34D399" font-size="14" font-weight="700">🏅 Antigravity AI Sertifikati</text>
  <text x="490" y="352" text-anchor="middle" fill="#94A3B8" font-size="11">Kod sifati va fizik invariantlar</text>
  <text x="490" y="368" text-anchor="middle" fill="#94A3B8" font-size="11">100% auditdan o'tganligi tasdiqlanadi</text>
  <line x1="815" y1="180" x2="815" y2="340" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="815" y1="340" x2="655" y2="340" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F43F5E"/></marker>
  </defs>
</svg>
