name: ILIMZIYO public textbook checks
on:
  pull_request:
  push:
    branches:
      - main
      - ilimziyo-2.0-ochiq-darslik
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          for f in js/*.js; do node --check "$f"; done
      - name: Locale JSON validity
        run: |
          for f in locales/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - name: Curriculum and HEMIS separation
        run: node --test tests/*.test.cjs
      - name: Internal references
        run: python3 tests/check_local_links.py
