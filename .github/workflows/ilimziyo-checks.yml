name: ILIMZIYO static checks
on:
  pull_request:
  push:
    branches:
      - ilimziyo-2.0-development
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check js/kabinet.js
          node --check js/diagnostika-data.js
          node --check js/diagnostika-ui.js
          node --check tests/diagnostika.test.cjs
          node --check js/experiment-journal-core.js
          node --check js/experiment-journal.js
          node --check tests/experiment-journal.test.cjs
          node --check js/mustaqil-data.js
          node --check js/mustaqil-core.js
          node --check js/mustaqil-ui.js
          node --check tests/mustaqil.test.cjs
      - name: Functional tests
        run: node --test tests/*.test.cjs
