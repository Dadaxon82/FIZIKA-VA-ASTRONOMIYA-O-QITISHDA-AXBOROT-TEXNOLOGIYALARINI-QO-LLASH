name: ILIMZIYO static checks
on:
  pull_request:
  push:
    branches:
      - ilimziyo-2.0-development
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check js/kabinet.js
      - name: Functional smoke tests
        run: node --test tests/kabinet.test.cjs
